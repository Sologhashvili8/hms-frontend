<header class="app-header">
  <div class="container app-header__inner">
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <span class="brand__mark">BR</span>
      <span class="brand__name">BookNRest</span>
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav" [class.nav--open]="menuOpen">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a routerLink="/rooms" routerLinkActive="is-active" (click)="closeMenu()">Rooms</a>

      @if (auth.isLoggedIn()) {
        @if (auth.isAdmin()) {
          <a routerLink="/admin" routerLinkActive="is-active" (click)="closeMenu()">Admin</a>
        }
        @if (auth.isManager()) {
          <a routerLink="/manager" routerLinkActive="is-active" (click)="closeMenu()">Management</a>
        }
        @if (auth.isGuest()) {
          <a
            routerLink="/account"
            routerLinkActive="is-active"
            (click)="closeMenu()"
            class="nav__profile"
          >
            {{ firstName() || auth.email() }}
          </a>
        } @else {
          <span class="nav__profile">{{ auth.email() }}</span>
        }
        <button class="btn btn-outline" type="button" (click)="logout()">Log out</button>
      } @else {
        <a class="btn btn-outline" routerLink="/login" (click)="closeMenu()">Log in</a>
        <a class="btn btn-primary" routerLink="/register" (click)="closeMenu()">Sign up</a>
      }
    </nav>
  </div>
</header>
