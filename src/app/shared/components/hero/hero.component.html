<section class="hero">
  <div class="container hero__inner">
    <p class="hero__eyebrow">Find your stay in Georgia</p>
    <h1 class="hero__title">Book the room that feels like home</h1>
    <p class="hero__subtitle">Search hotels across Tbilisi, Batumi and Kakheti — real availability, real prices.</p>

    <form class="hero__search" (ngSubmit)="emitSearch()">
      <div class="hero__field">
        <label for="hero-city">City</label>
        <input id="hero-city" name="city" type="text" placeholder="Tbilisi, Batumi, Telavi..." [(ngModel)]="city" />
      </div>

      <div class="hero__field">
        <label for="hero-rating">Min. rating</label>
        <select id="hero-rating" name="minRating" [(ngModel)]="minRating">
          <option [ngValue]="null">Any</option>
          <option [ngValue]="3">3+</option>
          <option [ngValue]="4">4+</option>
          <option [ngValue]="5">5</option>
        </select>
      </div>

      <button class="btn btn-primary hero__submit" type="submit">Search hotels</button>
    </form>
  </div>
</section>
