<div class="confirm-overlay" (click)="dismissed.emit()">
  <div class="confirm-dialog" (click)="$event.stopPropagation()">
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    <div class="confirm-dialog__actions">
      <button class="btn btn-outline" type="button" (click)="dismissed.emit()">{{ cancelLabel }}</button>
      <button
        type="button"
        [class]="danger ? 'confirm-dialog__danger-btn' : 'btn btn-primary'"
        (click)="confirmed.emit()"
      >
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>
