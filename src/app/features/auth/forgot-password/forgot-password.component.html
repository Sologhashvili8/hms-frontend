<section class="auth">
  <div class="auth__panel">
    <form class="auth__card" (ngSubmit)="submit()">
      <h1>Forget your password?</h1>
      <p class="auth__subtitle">Enter your email and we will send you a 6-digit code.</p>

      @if (error()) {
        <p class="auth__error">{{ error() }}</p>
      }

      <label>
        Email
        <input type="email" name="email" required [(ngModel)]="email" placeholder="name@example.com" />
      </label>

      <button class="btn btn-primary auth__submit" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Sending…' : 'Send code' }}
      </button>

      <p class="auth__switch">Remembered it? <a routerLink="/login">Log in</a></p>

      <app-social-login-row label="Log in with" />
    </form>
  </div>

  <aside class="auth__visual" [style.background-image]="heroPhoto() ? 'url(' + heroPhoto() + ')' : null"></aside>
</section>
