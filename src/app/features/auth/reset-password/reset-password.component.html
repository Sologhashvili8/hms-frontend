<section class="auth">
  <div class="auth__panel">
    <form class="auth__card" (ngSubmit)="submit()">
      <h1>Set a password</h1>
      <p class="auth__subtitle">Enter the 6-digit code we emailed you and choose a new password.</p>

      @if (error()) {
        <p class="auth__error">{{ error() }}</p>
      }

      @if (info()) {
        <p class="auth__subtitle">{{ info() }}</p>
      }

      <label>
        Email
        <input type="email" name="email" required [(ngModel)]="email" placeholder="name@example.com" />
      </label>

      <label>
        Code from email
        <input
          type="text"
          name="code"
          required
          inputmode="numeric"
          maxlength="6"
          pattern="\d{6}"
          title="6 digits"
          autocomplete="one-time-code"
          placeholder="6-digit code"
          [(ngModel)]="code"
        />
      </label>

      <label>
        New password
        <input type="password" name="newPassword" required minlength="6" [(ngModel)]="newPassword" />
      </label>

      <label>
        Confirm new password
        <input type="password" name="confirmPassword" required minlength="6" [(ngModel)]="confirmPassword" />
      </label>

      <button class="btn btn-primary auth__submit" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Setting password…' : 'Set password' }}
      </button>

      <p class="auth__switch">
        Did not get a code?
        <a href="#" (click)="$event.preventDefault(); resend()">{{ resending() ? 'Sending…' : 'Send again' }}</a>
      </p>

      <p class="auth__switch">Remembered it? <a routerLink="/login">Log in</a></p>

      <app-social-login-row label="Log in with" />
    </form>
  </div>

  <aside class="auth__visual" [style.background-image]="heroPhoto() ? 'url(' + heroPhoto() + ')' : null"></aside>
</section>
